services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # ephemeral: lives in RAM, gone when the container stops

  unit:
    build:
      context: ./backend
      target: test
    environment:
      ENV: test
      # Not consumed by the app yet (see docs/backlog.md TD-2) — provisioned
      # so the test-db wiring is ready for when persistence lands.
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
    depends_on:
      test-db:
        condition: service_healthy
    command: pytest -q --cov=. --cov-report=term-missing

  backend-e2e:
    build:
      context: ./backend
      target: build
    environment:
      ENV: development
      FRONTEND_ORIGIN: http://frontend-e2e:5173
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
    depends_on:
      test-db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    profiles: ["e2e"]

  frontend-e2e:
    build:
      context: ./frontend
      target: build
    environment:
      VITE_API_BASE_URL: http://backend-e2e:8000/api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend-e2e
    profiles: ["e2e"]

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /work
    volumes:
      - .:/work
      - /work/node_modules
    environment:
      CI: "true" # tells playwright.config.ts the servers are already running
      BASE_URL: http://frontend-e2e:5173
      API_BASE_URL: http://backend-e2e:8000/api
    depends_on:
      - frontend-e2e
      - backend-e2e
    command: sh -c "npm ci && npx playwright test"
    profiles: ["e2e"]
